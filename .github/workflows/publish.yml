name: Release

# 发行渠道：npm（@y9931666/dsh-plugin-roundtable）+ GitHub Release。
# 打 tag 之后先 `npm publish`，再建 GitHub Release；两条路都从这里触发。
#
# 打 tag 之前请**本地**跑一遍工程门禁（CI 这里只校验版本一致性，不重跑构建）：
#     npm run publish:guard      # compatibility + verify:package + release
#
# npm 发布需要一个仓库 secret：NPM_TOKEN（npmjs.com → Access Tokens → Granular
# Access Token，权限给该包或该 scope 的 read+write）。没有这个 secret 时
# npm 那一步会失败，GitHub Release 仍会照常创建。
#
# 触发方式：
#   git tag v<version> && git push origin v<version>
# 要求 package.json 的 version 与 tag 严格对应，且 release-notes/v<version>.md 存在。

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Package version to release (must equal package.json version)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == '9931666/dsh-plugin-roundtable'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read package version
        id: version
        shell: bash
        run: |
          package_version="$(node --print "require('./package.json').version")"
          echo "value=${package_version}" >> "$GITHUB_OUTPUT"

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}"
            test -f "release-notes/v${PACKAGE_VERSION}.md"
          else
            test "${RELEASE_VERSION}" = "${PACKAGE_VERSION}"
          fi

      - name: Publish to npm
        if: github.event_name == 'push' && env.NPM_TOKEN != ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          # lib/ 不进 git，CI 必须自己重建产物 —— 发出去的必须是这次 tag 的构建结果。
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
          # 预发布后缀自动进 next，稳定版进 latest（与 scripts/release.mjs 的渠道判定一致）。
          npm publish --provenance --access public

      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: RoundTable v${{ steps.version.outputs.value }}
          body_path: release-notes/v${{ steps.version.outputs.value }}.md
          draft: false
          # 预发布（1.0.0-rc.1 这类）标成 prerelease，稳定版才是正式 Release。
          prerelease: ${{ contains(steps.version.outputs.value, '-') }}
